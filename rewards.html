<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="codeora-logo.svg?v=20261122-task-reset-lessons-02">
  <meta name="theme-color" content="#fbfcfe">
  <meta name="description" content="Codeora — learn, code and build.">
  <title>XP and Achievements · Codeora</title>
  <link rel="stylesheet" href="style.css?v=20261122-task-reset-lessons-02">
<link rel="stylesheet" href="site-header.css?v=20261123-unified-header-02">
</head>
<body data-page="rewards" data-track="sql">
  

<div id="site-header"></div>
<div id="load-error" class="load-error page-error" role="alert" hidden></div>
<main class="page-shell">
  <section class="page-hero compact-hero"><p class="eyebrow">YOUR MILESTONES</p><h1>Progress worth <em>celebrating.</em></h1><p class="lead">Earn XP for new solved questions, build a daily practice streak and unlock achievements as you learn.</p></section>
  <section class="rewards-summary">
    <article><small>TOTAL XP</small><strong id="rewards-total-xp">0</strong></article>
    <article><small>CURRENT LEVEL</small><strong id="rewards-level-name">SQL Rookie</strong></article>
    <article><small>BEST STREAK</small><strong id="rewards-best-streak">0 days</strong></article>
  </section>
  <section class="page-section"><div class="section-heading"><p class="eyebrow">UNLOCK YOUR MILESTONES</p><h2>Achievements</h2><p id="achievement-count">0 / 8 unlocked</p></div><div id="achievement-grid" class="achievement-grid rewards-achievements"><p class="dashboard-loading">Loading achievements…</p></div></section>
  <footer>Codeora · Rewards</footer>
</main>
  <script>
    (() => {
      const showBootError = (message) => {
        const target = document.getElementById('load-error');
        if (target) { target.hidden = false; target.textContent = message; }
      };
      if (window.location.protocol === 'file:') {
        showBootError('Open Codeora through a local web server: python3 -m http.server 5173, then visit http://localhost:5173.');
      } else {
        window.addEventListener('error', (event) => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
            showBootError('Codeora could not load app.js. Re-extract the complete ZIP so all project files are in the same folder.');
          }
        }, true);
        window.setTimeout(() => {
          if (!window.CodeoraStarted && !window.CodeoraFailed) showBootError('Codeora did not start. Check that app.js and lessons.json are beside this page.');
        }, 8000);
      }
    })();
  </script>
  <script src="site-header.js?v=20261123-unified-header-02"></script><script src="account-bootstrap.js?v=20261123-unified-header-02"></script>
  <script src="professional.js?v=20261123-unified-header-02"></script>
  <script type="module" src="app.js?v=20261122-task-reset-lessons-02"></script>
</body>
</html>
