<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Bookmarks | Codeora</title><link rel="stylesheet" href="course.css"><link rel="stylesheet" href="python-practice.css"></head><body><main class="py-page"><a href="python.html">← Python practice</a><h1>Bookmarked questions</h1><div id="saved"></div></main><script>const ids=JSON.parse(localStorage.getItem('codeora.python.bookmarks.v1')||'[]');const box=document.getElementById('saved');if(!ids.length)box.textContent='No bookmarked questions yet.';Promise.all(Array.from({length:42},(_,i)=>fetch('python/topics.json').then(r=>r.json()).then(t=>fetch('python/'+t[i].questionFile).then(r=>r.json()).then(q=>q.map(x=>({...x,topic:t[i].name})))))).then(groups=>{const all=groups.flat().filter(q=>ids.includes(q.id));box.innerHTML=all.map(q=>'<p><a href="python.html">'+q.topic+' · '+q.title+'</a></p>').join('')||'No bookmarked questions yet.';});</script></body></html>
